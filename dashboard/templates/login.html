<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ · RestoSuite Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <form method="post" class="card login">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-name">More yogurt Paragon</div>
        <div class="brand-sub">RestoSuite Dashboard</div>
      </div>
    </div>
    <label for="password">รหัสผ่าน</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required autofocus>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <button type="submit" class="primary">เข้าสู่ระบบ</button>
  </form>
</body>
</html>
