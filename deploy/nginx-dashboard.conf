# nginx site for the dashboard. Replace report.example.com with your domain, then:
#   sudo cp deploy/nginx-dashboard.conf /etc/nginx/sites-available/restosuite-dashboard
#   sudo ln -s /etc/nginx/sites-available/restosuite-dashboard /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d report.example.com      # adds HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name report.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        proxy_pass http://127.0.0.1:5021;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
