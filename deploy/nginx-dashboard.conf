# nginx site for the dashboard at report.spicycatgroups.com.
# Install with: sudo sh deploy/setup-nginx.sh   (certbot then adds the HTTPS server block)
server {
    listen 80;
    listen [::]:80;
    server_name report.spicycatgroups.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        proxy_pass http://127.0.0.1:5021;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
